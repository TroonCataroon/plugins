name: Test multi-mouse-control

on:
  push:
    branches:
      - feat/multi-mouse-control
    paths:
      - "multi-mouse-control/**"
      - ".github/workflows/test-multi-mouse-control.yml"
  pull_request:
    paths:
      - "multi-mouse-control/**"
      - ".github/workflows/test-multi-mouse-control.yml"
      - ".cursor-plugin/marketplace.json"
      - "README.md"

jobs:
  pester:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Pester
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run PowerShell tests
        run: |
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = "multi-mouse-control/tests"
          $configuration.Run.Exit = $true
          $configuration.Output.Verbosity = "Detailed"
          $configuration.TestResult.Enabled = $true
          $configuration.TestResult.OutputPath = "multi-mouse-control-test-results.xml"
          Invoke-Pester -Configuration $configuration

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: multi-mouse-control-test-results
          path: multi-mouse-control-test-results.xml
